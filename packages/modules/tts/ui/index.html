<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>语音合成</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; padding: 18px;
    font: 14px/1.6 "Microsoft YaHei", system-ui, sans-serif;
    background: #1a1a1f; color: #e4e4e8;
  }
  h1 { font-size: 1.05rem; font-weight: 600; margin: 0 0 4px; }
  .sub { font-size: 0.8rem; opacity: 0.55; margin-bottom: 18px; }
  .box {
    background: rgba(255,255,255,0.035);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 8px; padding: 14px; margin-bottom: 14px;
  }
  label { display: block; font-size: 0.82rem; margin-bottom: 5px; opacity: 0.85; }
  textarea, select, input[type=text] {
    width: 100%; box-sizing: border-box; padding: 7px 9px;
    font: inherit; font-size: 0.85rem; color: inherit;
    background: rgba(0,0,0,0.28);
    border: 1px solid rgba(255,255,255,0.12); border-radius: 5px;
  }
  textarea { resize: vertical; min-height: 70px; }
  .row { display: flex; gap: 10px; align-items: flex-end; }
  .row > * { flex: 1; }
  button {
    padding: 7px 16px; font: inherit; font-size: 0.85rem;
    color: #fff; background: #4a9eff; border: none; border-radius: 5px;
    cursor: pointer; flex: 0 0 auto;
  }
  button:hover:not(:disabled) { background: #5faaff; }
  button:disabled { opacity: 0.45; cursor: default; }
  button.ghost { background: transparent; border: 1px solid rgba(255,255,255,0.2); color: inherit; }
  button.ghost:hover:not(:disabled) { border-color: #4a9eff; color: #4a9eff; background: transparent; }
  .status { font-size: 0.8rem; margin-top: 10px; min-height: 18px; }
  .status.ok { color: #4caf72; }
  .status.err { color: #e05555; }
  audio { width: 100%; margin-top: 10px; }
  .voice-list { display: flex; flex-wrap: wrap; gap: 8px; }
  .voice {
    padding: 7px 12px; border-radius: 6px; cursor: pointer;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    font-size: 0.83rem;
  }
  .voice:hover { border-color: #4a9eff; }
  .voice.active { background: rgba(74,158,255,0.18); border-color: #4a9eff; }
  .voice .meta { font-size: 0.72rem; opacity: 0.5; display: block; }
  .empty { font-size: 0.82rem; opacity: 0.45; }
  .engines { display: flex; flex-wrap: wrap; gap: 8px; }
  .engine {
    padding: 6px 11px; border-radius: 5px; font-size: 0.8rem;
    background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1);
  }
  .engine.ready { border-color: rgba(76,175,114,0.5); color: #4caf72; }
  .engine.down { opacity: 0.45; }
</style>
</head>
<body>
  <h1>语音合成</h1>
  <div class="sub">试听与快速合成。引擎开关、服务地址等长期配置请到「设置 → 模块管理 → tts → 模块配置」。</div>

  <div class="box">
    <label>引擎状态</label>
    <div id="engines" class="engines"><span class="empty">正在探测……</span></div>
  </div>

  <div class="box">
    <label>音色</label>
    <div id="voices" class="voice-list"><span class="empty">正在加载……</span></div>
  </div>

  <div class="box">
    <label for="text">文本</label>
    <textarea id="text" placeholder="输入要合成的话……">你好，这里是苦瓜工作室。</textarea>
    <div class="row" style="margin-top:10px">
      <div>
        <label for="emotion">情绪</label>
        <select id="emotion">
          <option value="">默认</option>
          <option value="happy">开心</option>
          <option value="sad">悲伤</option>
          <option value="angry">生气</option>
          <option value="afraid">害怕</option>
          <option value="disgusted">厌恶</option>
        </select>
      </div>
      <div>
        <label for="speed">语速</label>
        <input id="speed" type="text" value="1.0" placeholder="1.0">
      </div>
      <button id="speak">合成</button>
    </div>
    <div id="status" class="status"></div>
    <audio id="player" controls class="hidden" style="display:none"></audio>
  </div>

  <script src="/plugin-sdk.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);
    let 当前音色 = "";

    function 设状态(文本, 类) {
      const el = $("status");
      el.textContent = 文本;
      el.className = "status" + (类 ? " " + 类 : "");
    }

    async function 载引擎() {
      try {
        const 状态 = await window.kugua.request("tts", "tts.status", {});
        const 盒 = $("engines");
        const 引擎 = 状态.engines ?? [];
        if (!引擎.length) { 盒.innerHTML = '<span class="empty">未配置引擎（仅 CPU 兜底）</span>'; return; }
        盒.innerHTML = 引擎.map((e) =>
          `<span class="engine ${e.可用 ? "ready" : "down"}" title="${e.详情 || e.说明 || ""}">` +
          `${e.引擎 || e.name || e.engine}${e.可用 ? " ✓" : " ✗"}</span>`
        ).join("");
      } catch (err) {
        $("engines").innerHTML = `<span class="empty">探测失败：${err.message || err}</span>`;
      }
    }

    async function 载音色() {
      try {
        const r = await window.kugua.request("tts", "tts.voices", {});
        const 列表 = r.音色 ?? r.voices ?? [];
        const 盒 = $("voices");
        if (!列表.length) { 盒.innerHTML = '<span class="empty">没有可用音色（在模块配置里添加）</span>'; return; }
        盒.innerHTML = 列表.map((v) => {
          const id = v.id || v.名称 || v.name;
          const 名 = v.名称 || v.name || id;
          const 引擎 = v.引擎 || v.engine || "";
          return `<div class="voice" data-id="${id}">${名}<span class="meta">${引擎}</span></div>`;
        }).join("");
        盒.querySelectorAll(".voice").forEach((el) => {
          el.addEventListener("click", () => {
            盒.querySelectorAll(".voice").forEach((x) => x.classList.remove("active"));
            el.classList.add("active");
            当前音色 = el.dataset.id;
          });
        });
        // 默认选第一个
        const 首 = 盒.querySelector(".voice");
        if (首) 首.click();
      } catch (err) {
        $("voices").innerHTML = `<span class="empty">加载失败：${err.message || err}</span>`;
      }
    }

    $("speak").addEventListener("click", async () => {
      const 文本 = $("text").value.trim();
      if (!文本) { 设状态("请输入文本", "err"); return; }
      const 按钮 = $("speak");
      按钮.disabled = true;
      设状态("合成中……");
      try {
        const 参数 = { 文本: 文本, 格式: "wav" };
        if (当前音色) 参数.音色 = 当前音色;
        const 语速 = parseFloat($("speed").value);
        if (!isNaN(语速) && 语速 > 0) 参数.语速 = 语速;
        const 情绪 = $("emotion").value;
        if (情绪) 参数.情绪 = { 类型: 情绪 };

        const 结果 = await window.kugua.request("tts", "tts.speak", 参数);
        // 不指定输出路径时模块返回 base64，页面直接转 blob 播放，不落临时文件
        let src;
        if (结果.base64) {
          const 二进制 = atob(结果.base64);
          const 字节 = new Uint8Array(二进制.length);
          for (let i = 0; i < 二进制.length; i++) 字节[i] = 二进制.charCodeAt(i);
          const 类型 = 结果.format === "mp3" ? "audio/mpeg" : 结果.format === "ogg" ? "audio/ogg" : "audio/wav";
          src = URL.createObjectURL(new Blob([字节], { type: 类型 }));
        } else if (结果.输出路径) {
          src = await window.kugua.getFileUrl(结果.输出路径);
        } else {
          设状态("模块未返回音频数据", "err");
          return;
        }
        const 播放器 = $("player");
        // 释放上一次的 blob url，避免内存泄漏
        if (播放器.dataset.blob === "1" && 播放器.src.startsWith("blob:")) URL.revokeObjectURL(播放器.src);
        播放器.dataset.blob = 结果.base64 ? "1" : "0";
        播放器.src = src;
        播放器.style.display = "block";
        const 耗时 = 结果.elapsedMs ? ` · ${(结果.elapsedMs / 1000).toFixed(2)}s` : "";
        设状态(`完成 · ${结果.engine ?? ""}${耗时}`, "ok");
        void 播放器.play().catch(() => undefined);
      } catch (err) {
        设状态("失败：" + (err.message || err), "err");
      } finally {
        按钮.disabled = false;
      }
    });

    设状态("正在连接平台……");
    if (window.kugua && window.kugua.onReady) window.kugua.onReady(() => { 设状态(""); 载引擎(); 载音色(); });
    else { 载引擎(); 载音色(); }
  </script>
</body>
</html>
