<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>图片编辑</title>
    <link rel="stylesheet" href="editor.css" />
  </head>
  <body>
    <div id="app">
      <!-- 未选图时的空态：唯一的入口 -->
      <div id="empty">
        <div class="empty-box">
          <div class="empty-icon">🖼</div>
          <div class="empty-title">把图片拖进来</div>
          <div class="empty-sub">或者点下面的按钮选一张</div>
          <div class="empty-actions">
            <button id="btn-pick" class="primary">选择本地图片</button>
          </div>
          <div class="empty-hint">
            也可以先在聊天框发一张图，这里会自动接上
          </div>
        </div>
      </div>

      <!-- 编辑区 -->
      <div id="stage" hidden>
        <aside id="actions">
          <div class="panel-head">
            <span class="panel-title">动作</span>
            <input id="action-filter" class="filter" placeholder="搜索动作…" />
          </div>
          <div id="action-list"></div>
        </aside>

        <main id="canvas-wrap">
          <div id="canvas-scroll">
            <div id="canvas-inner">
              <img id="preview" alt="预览" />
              <div id="overlay"></div>
            </div>
          </div>
          <div id="frames-bar" hidden>
            <div id="frames-head">
              <span id="frames-title">帧</span>
              <span id="frames-count" class="muted"></span>
            </div>
            <div id="frames-strip"></div>
          </div>
          <div id="statusbar">
            <span id="status-size">—</span>
            <span id="status-msg"></span>
          </div>
        </main>

        <aside id="params">
          <div class="panel-head">
            <span id="params-title" class="panel-title">参数</span>
          </div>
          <div id="params-form"></div>
          <div id="params-actions">
            <button id="btn-apply" class="primary" disabled>应用</button>
            <button id="btn-reset" class="ghost">复位</button>
          </div>
          <div id="params-note"></div>
          <div id="result-bar" hidden>
            <div class="result-title">结果</div>
            <div id="result-actions">
              <button id="btn-save" class="ghost">另存为…</button>
              <button id="btn-copy" class="ghost">复制图片</button>
              <button id="btn-chat" class="ghost">发到聊天框</button>
            </div>
          </div>
        </aside>
      </div>
    </div>
    <script src="editor.js" type="module"></script>
  </body>
</html>
